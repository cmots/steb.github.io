  - generic [ref=e25]:
    - heading "Abstract" [level=2] [ref=e26]
    - paragraph [ref=e27]: "Speech-to-speech translation (S2ST) should preserve not only lexical meaning, but also expressive attributes: emotion, scenario style, and nonverbal vocalizations (NVs). We introduce STEB (Speech-to-Speech Translation Expressiveness Benchmark), a 32.6-hour Chinese–English benchmark that evaluates both standard dimensions (translation fidelity, speaker similarity, duration alignment) and expressiveness dimensions (emotion, scenario style, NV preservation). For expressiveness evaluation, STEB uses a caption-then-summarize framework that converts speech into structured expressive attributes and compares source and hypothesis attributes with an LLM judge. Human validation shows statistically significant correlations with listener judgments across all expressive dimensions. We evaluate six S2ST systems and find that current systems achieve strong translation fidelity but still struggle with emotion preservation (best: 3.82/5) and NV preservation (best: 2.31/5), identifying expressiveness preservation as an open challenge for S2ST."
  - generic [ref=e29]:
    - heading "Overview" [level=2] [ref=e30]
    - 'figure "Figure 1. Overview of STEB. (a) Benchmark example showing annotation dimensions: transcription, translation, rich audio description, emotion, scenario style, and text with NVs. (b) The automatic expressiveness judge: a Captioner–Summary pipeline and NV detection extract hypothesis annotations, which an LLM Scorer compares against source annotations. (c) Radar chart comparing baseline systems across six dimensions." [ref=e31]':
      - 'img "STEB Overview: (a) Benchmark annotation dimensions, (b) Automatic expressiveness judge pipeline, (c) Radar chart comparing S2ST systems" [ref=e32]'
