        - paragraph [ref=e41]: Most systems achieve strong translation fidelity, but expressiveness preservation lags far behind. Cascaded systems score 1.67–1.73 on emotion (out of 5), while end-to-end models reach up to 3.82.
      - generic [ref=e42]:
        - generic [ref=e43]: "2"
        - heading "NV Needs Explicit Modeling" [level=3] [ref=e44]
        - paragraph [ref=e45]: Nonverbal vocalizations benefit from explicit text-level markers. Systems with NV detection reach 2.31/5, while end-to-end systems score no higher than 1.58/5.
      - generic [ref=e46]:
        - generic [ref=e47]: "3"
        - heading "Duration Requires Control" [level=3] [ref=e48]
        - paragraph [ref=e49]:
          - text: Only systems with dedicated duration control achieve strong alignment (SLC
          - subscript [ref=e50]: "0.2"
