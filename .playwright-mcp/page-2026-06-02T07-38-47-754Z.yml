  - generic [ref=e52]:
    - heading "Contributions" [level=2] [ref=e53]
    - list [ref=e54]:
      - listitem [ref=e55]: We introduce STEB, a 32.6-hour Chinese–English S2ST benchmark covering six real-world scenarios and expressive dimensions including emotion, scenario style, and NVs.
      - listitem [ref=e56]: We build a scalable curation pipeline that converts real-world audio into structured source annotations with automatic quality control and human validation.
      - listitem [ref=e57]: We propose a reference-free LLM-as-a-judge framework that scores emotion, scenario style, and NV preservation, showing significant correlation with human judgments.
      - listitem [ref=e58]: We evaluate six S2ST systems on STEB and reveal that current systems achieve strong translation fidelity but still struggle to preserve emotion and NVs.
